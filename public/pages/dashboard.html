<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Dheeran</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@300;400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="demo-banner"><span>🎮 DEMO MODE — Restaurant Owner Dashboard</span></div>
  <nav class="navbar">
    <div class="wrap nav-inner">
      <a href="/" class="logo">Dheeran<span class="dot">.</span></a>
      <div class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/dashboard" class="active-link">Dashboard</a>
      </div>
      <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </div>
  </nav>

  <div class="page-content">
    <div class="wrap">
      <div class="page-header">
        <span class="eyebrow">Owner Panel</span>
        <h1>Restaurant Dashboard</h1>
        <p class="section-sub">Manage orders and track business metrics.</p>
      </div>

      <!-- Stats -->
      <div id="statsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:36px;">
        <div class="checkout-section" style="text-align:center;">
          <div style="font-size:2rem;font-weight:800;color:var(--mustard-bright);" id="statTotal">0</div>
          <div style="color:var(--cream-dim);font-size:0.85rem;">Total Orders</div>
        </div>
        <div class="checkout-section" style="text-align:center;">
          <div style="font-size:2rem;font-weight:800;color:var(--leaf);" id="statPaid">0</div>
          <div style="color:var(--cream-dim);font-size:0.85rem;">Paid Orders</div>
        </div>
        <div class="checkout-section" style="text-align:center;">
          <div style="font-size:2rem;font-weight:800;color:var(--chili);" id="statPreparing">0</div>
          <div style="color:var(--cream-dim);font-size:0.85rem;">Preparing</div>
        </div>
        <div class="checkout-section" style="text-align:center;">
          <div style="font-size:2rem;font-weight:800;color:var(--mustard-bright);" id="statRevenue">₹0</div>
          <div style="color:var(--cream-dim);font-size:0.85rem;">Today's Revenue</div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
        <button class="tab active" onclick="filterOrders('all',this)">All</button>
        <button class="tab" onclick="filterOrders('pending',this)">📝 Pending</button>
        <button class="tab" onclick="filterOrders('accepted',this)">👨‍🍳 Accepted</button>
        <button class="tab" onclick="filterOrders('preparing',this)">🔥 Preparing</button>
        <button class="tab" onclick="filterOrders('ready',this)">📦 Ready</button>
        <button class="tab" onclick="filterOrders('out_for_delivery',this)">🛵 Out</button>
        <button class="tab" onclick="filterOrders('delivered',this)">✅ Done</button>
      </div>

      <div id="ordersLoading" style="text-align:center;padding:40px;">
        <div class="spinner"></div>
        <p style="color:var(--cream-dim);margin-top:12px;">Loading orders...</p>
      </div>

      <div id="ordersEmpty" style="display:none;text-align:center;padding:60px;">
        <span style="font-size:3rem;">📋</span>
        <p style="color:var(--cream-dim);margin-top:12px;">No orders found.</p>
      </div>

      <div id="ordersList"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

<script>
var SB_URL = 'https://isamfamwrrtkrfrmewto.supabase.co';
var SB_KEY = 'sb_publishable_RXzfAbcFjgoZjBxympcRiw_edz8AUO9';
var RESTAURANT_ID = 'dheeran-001';
var allOrders = [];
var currentFilter = 'all';

var STATUS_LABELS = { pending:'📝 Pending', accepted:'👨‍🍳 Accepted', preparing:'🔥 Preparing', ready:'📦 Ready', out_for_delivery:'🛵 Out for Delivery', delivered:'✅ Delivered', cancelled:'❌ Cancelled' };
var STATUS_TRANSITIONS = {
  pending: ['accepted', 'cancelled'],
  accepted: ['preparing', 'cancelled'],
  preparing: ['ready'],
  ready: ['out_for_delivery'],
  out_for_delivery: ['delivered'],
  delivered: [],
  cancelled: []
};

function sbQuery(table, params) {
  return fetch(SB_URL + '/rest/v1/' + table + '?' + params, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  }).then(function(r) { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

function formatCurrency(a) { return '₹' + Math.round(a).toLocaleString('en-IN'); }
function timeAgo(dateStr) {
  var diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.innerHTML = '<span>' + (type === 'error' ? '⚠️' : '✓') + '</span> ' + msg;
  c.appendChild(t);
  setTimeout(function(){t.classList.add('removing');setTimeout(function(){t.remove();},300);},3000);
}

async function loadDashboard() {
  try {
    // Stats
    var totalQ = 'select=id&restaurant_id=eq.' + RESTAURANT_ID;
    var allOrdersData = await sbQuery('orders', totalQ);
    document.getElementById('statTotal').textContent = allOrdersData.length;

    var paidOrders = allOrdersData.filter(function(o){return o.payment_status === 'paid';});
    document.getElementById('statPaid').textContent = paidOrders.length;

    var preparing = allOrdersData.filter(function(o){return o.order_status === 'preparing';});
    document.getElementById('statPreparing').textContent = preparing.length;

    var today = new Date().toISOString().split('T')[0];
    var todayOrders = paidOrders.filter(function(o){return o.created_at && o.created_at.slice(0,10) === today;});
    var revenue = todayOrders.reduce(function(s,o){return s + (o.total_amount||0);}, 0);
    document.getElementById('statRevenue').textContent = formatCurrency(revenue);

    // Orders with items
    var orderData = await sbQuery('orders', 'select=*&restaurant_id=eq.' + RESTAURANT_ID + '&order=created_at.desc&limit=50');
    for (var i = 0; i < orderData.length; i++) {
      var orderItems = await sbQuery('order_items', 'select=*&order_id=eq.' + orderData[i].id);
      orderData[i].items = orderItems;
    }
    allOrders = orderData;

    document.getElementById('ordersLoading').style.display = 'none';
    renderOrders();
  } catch(err) {
    console.error('Dashboard error:', err);
    document.getElementById('ordersLoading').innerHTML =
      '<div class="empty-state"><span class="icon" style="font-size:3rem;">⚠️</span>' +
      '<p style="color:var(--cream-dim);margin-top:12px;">Failed to load orders.</p>' +
      '<p style="color:rgba(245,236,218,0.4);font-size:0.82rem;margin-top:8px;">' + err.message + '</p>' +
      '<button onclick="loadDashboard()" style="margin-top:16px;padding:10px 24px;background:var(--chili);color:var(--cream);border:none;border-radius:8px;cursor:pointer;">Retry</button></div>';
  }
}

function filterOrders(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.page-content .wrap > div:nth-child(3) .tab').forEach(function(t){t.classList.remove('active');});
  if (btn) btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  var filtered = currentFilter === 'all' ? allOrders : allOrders.filter(function(o){return o.order_status === currentFilter;});
  var container = document.getElementById('ordersList');
  var empty = document.getElementById('ordersEmpty');

  if (!filtered.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  var html = '';
  filtered.forEach(function(order) {
    var itemsHtml = '';
    (order.items || []).forEach(function(item) {
      itemsHtml += '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:var(--cream-dim);">' + item.quantity + ' × ' + item.item_name + '</span><span style="color:var(--mustard-bright);font-family:\'Kalam\',cursive;">' + formatCurrency(item.subtotal) + '</span></div>';
    });

    var transitions = STATUS_TRANSITIONS[order.order_status] || [];
    var actionsHtml = '';
    transitions.forEach(function(next) {
      var labels = { accepted:'Accept', preparing:'Start Preparing', ready:'Mark Ready', out_for_delivery:'Out for Delivery', delivered:'Delivered', cancelled:'Cancel' };
      var colors = { cancelled:'var(--chili)' };
      actionsHtml += '<button onclick="updateStatus(\'' + order.id + '\',\'' + next + '\',\'' + (order.order_number||'') + '\',\'' + (order.customer_name||'') + '\',' + (order.total_amount||0) + ')" style="padding:8px 16px;border-radius:8px;border:1px solid ' + (colors[next] || 'rgba(245,236,218,0.14)') + ';background:' + (colors[next] ? 'rgba(193,68,45,0.1)' : 'rgba(91,138,90,0.1)') + ';color:' + (colors[next] || 'var(--leaf)') + ';cursor:pointer;font-family:inherit;font-size:0.82rem;font-weight:600;">' + (labels[next] || next) + '</button>';
    });

    html += '<div class="checkout-section" style="margin-bottom:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<div><h3 style="margin:0;">Order #' + (order.order_number || order.id.slice(0,8)) + '</h3>' +
        '<span style="color:var(--cream-dim);font-size:0.82rem;">' + timeAgo(order.created_at) + '</span></div>' +
        '<span class="badge" style="background:' + (order.payment_status === 'paid' ? 'rgba(91,138,90,0.2);color:var(--leaf)' : 'rgba(193,68,45,0.2);color:var(--chili)') + ';">' + (order.payment_status === 'paid' ? 'PAID ✓' : order.payment_status.toUpperCase()) + '</span>' +
      '</div>' +
      '<div style="color:var(--cream-dim);font-size:0.9rem;margin-bottom:12px;">' +
        '<p>👤 <span style="color:var(--cream);">' + order.customer_name + '</span> · 📞 ' + order.customer_phone + '</p>' +
        (order.delivery_address ? '<p style="margin-top:4px;">📍 ' + order.delivery_address + '</p>' : '') +
        (order.delivery_mode ? '<p style="margin-top:4px;">Mode: ' + order.delivery_mode + '</p>' : '') +
      '</div>' +
      itemsHtml +
      '<div style="border-top:1px solid rgba(245,236,218,0.14);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;">' +
        '<div style="font-family:\'Bricolage Grotesque\',sans-serif;font-size:1.15rem;font-weight:800;color:var(--mustard-bright);">Total: ' + formatCurrency(order.total_amount) + '</div>' +
        '<span class="badge" style="font-size:0.82rem;">' + (STATUS_LABELS[order.order_status] || order.order_status) + '</span>' +
      '</div>' +
      (actionsHtml ? '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' + actionsHtml + '</div>' : '') +
      (order.delivery_latitude && order.delivery_longitude ? '<div style="margin-top:12px;"><button onclick="showOrderMap(this,\'' + order.delivery_latitude + '\',\'' + order.delivery_longitude + '\')" style="padding:6px 14px;border-radius:8px;border:1px solid rgba(245,236,218,0.14);background:rgba(232,169,59,0.1);color:var(--mustard-bright);cursor:pointer;font-size:0.82rem;">📍 View on Map</button></div>' : '') +
      '</div>';
  });
  container.innerHTML = html;
}

async function updateStatus(orderId, newStatus, orderNum, customerName, totalAmount) {
  try {
    var res = await fetch(SB_URL + '/rest/v1/orders?eq.' + orderId, {
      method: 'PATCH',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ order_status: newStatus })
    });
    if (!res.ok) throw new Error('Update failed');

    // Send ntfy status notification
    fetch('/api/ntfy/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_number: orderNum, customer_name: customerName, total_amount: totalAmount, new_status: newStatus })
    }).catch(function(){});

    showToast('Order #' + orderNum + ' → ' + newStatus);
    loadDashboard();
  } catch(err) {
    showToast('Failed to update: ' + err.message, 'error');
  }
}

function showOrderMap(btn, lat, lng) {
  var existing = btn.parentElement.querySelector('.mini-map');
  if (existing) { existing.remove(); return; }
  var div = document.createElement('div');
  div.className = 'mini-map';
  div.style.cssText = 'width:100%;height:200px;border-radius:12px;margin-top:12px;border:1px solid rgba(245,236,218,0.14);';
  btn.parentElement.appendChild(div);
  var m = L.map(div).setView([RESTAURANT_LAT, RESTAURANT_LNG], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(m);
  L.marker([RESTAURANT_LAT, RESTAURANT_LNG]).addTo(m).bindPopup('🏠 Dheeran');
  L.marker([parseFloat(lat), parseFloat(lng)]).addTo(m).bindPopup('📍 Customer');
  setTimeout(function(){m.invalidateSize();}, 200);
}

document.addEventListener('DOMContentLoaded', function() {
  loadDashboard();
  setInterval(loadDashboard, 15000);
});
</script>
</body>
</html>
