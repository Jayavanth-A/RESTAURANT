<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Dheeran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@300;400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="demo-banner"><span>🎮 DEMO MODE — No real money will be charged.</span></div>
  <nav class="navbar">
    <div class="wrap nav-inner">
      <a href="/" class="logo">Dheeran<span class="dot">.</span></a>
      <div class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/menu" class="active-link">Menu</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/checkout" class="btn btn-primary btn-sm" id="cartNavBtn" style="position:relative;">🛒 Cart <span id="cartBadge" style="display:none;" class="badge badge-bestseller"></span></a>
      </div>
      <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </div>
  </nav>

  <div class="page-content">
    <div class="wrap">
      <div class="page-header">
        <span class="eyebrow">On the Board</span>
        <h1>The Menu</h1>
        <p class="section-sub">Fresh Andhra spices, Chinese wok mastery, and dum biryanis.</p>
      </div>

      <!-- Search & Filters -->
      <div style="max-width:640px;margin:0 auto 28px;">
        <div style="position:relative;">
          <input type="text" id="searchInput" placeholder="🔍 Search dishes..." style="width:100%;padding:14px 18px 14px 44px;border-radius:12px;border:1px solid rgba(245,236,218,0.14);background:rgba(46,36,25,0.9);color:var(--cream);font-size:0.95rem;font-family:inherit;outline:none;">
          <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.1rem;">🔍</span>
        </div>
        <div class="tabs" style="display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap;">
          <button class="tab active" onclick="setDiet('all',this)">All</button>
          <button class="tab" onclick="setDiet('veg',this)">🟢 Veg</button>
          <button class="tab" onclick="setDiet('nonveg',this)">🔴 Non-Veg</button>
        </div>
      </div>

      <div id="menuLoading" style="text-align:center;padding:60px 20px;">
        <div class="spinner"></div>
        <p style="color:var(--cream-dim);margin-top:16px;">Loading menu from Supabase...</p>
      </div>

      <!-- Category Tabs -->
      <div id="categoryTabs" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;"></div>

      <!-- Menu Grid -->
      <div id="menuContent" style="display:none;">
        <div id="menuGrid" class="menu-grid"></div>
        <div id="menuEmpty" style="display:none;text-align:center;padding:40px;">
          <div class="empty-state">
            <span class="icon" style="font-size:3rem;">🍽️</span>
            <p style="color:var(--cream-dim);margin-top:12px;">No dishes found matching your search.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart FAB -->
  <a href="/checkout" id="cartFab" style="display:none;position:fixed;bottom:28px;right:28px;z-index:90;width:60px;height:60px;border-radius:50%;background:var(--chili);color:var(--cream);font-size:1.5rem;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(193,68,45,0.5);text-decoration:none;">
    🛒
    <span id="fabBadge" style="position:absolute;top:-4px;right:-4px;background:var(--mustard);color:var(--charcoal);font-size:0.7rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;"></span>
  </a>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

<script>
// ===== CONFIG — FIRST LINES, ALWAYS AVAILABLE =====
var SB_URL = 'https://isamfamwrrtkrfrmewto.supabase.co';
var SB_KEY = 'sb_publishable_RXzfAbcFjgoZjBxympcRiw_edz8AUO9';
var RESTAURANT_ID = 'dheeran-001';

// ===== SUPABASE REST API HELPER =====
function sbQuery(table, params) {
  var url = SB_URL + '/rest/v1/' + table + '?' + params;
  return fetch(url, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + r.statusText);
    return r.json();
  });
}

// ===== CART =====
var Cart = {
  KEY: 'dheeran_cart',
  get: function() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; } },
  save: function(items) { localStorage.setItem(this.KEY, JSON.stringify(items)); },
  add: function(item) {
    var items = this.get();
    var ex = items.find(function(i) { return i.menuItemId === item.id; });
    if (ex) { ex.quantity = Math.min(ex.quantity + 1, 99); }
    else { items.push({ menuItemId: item.id, name: item.name, price: item.price, diet: item.diet, quantity: 1 }); }
    this.save(items); this.updateBadge(); return items;
  },
  updateQuantity: function(menuItemId, delta) {
    var items = this.get();
    var idx = items.findIndex(function(i) { return i.menuItemId === menuItemId; });
    if (idx === -1) return items;
    items[idx].quantity += delta;
    if (items[idx].quantity <= 0) items.splice(idx, 1);
    this.save(items); this.updateBadge(); return items;
  },
  getCount: function() { return this.get().reduce(function(s, i) { return s + i.quantity; }, 0); },
  updateBadge: function() {
    var badge = document.getElementById('cartBadge');
    var fab = document.getElementById('cartFab');
    var fabBadge = document.getElementById('fabBadge');
    if (!badge) return;
    var c = this.getCount();
    badge.textContent = c; badge.style.display = c > 0 ? 'flex' : 'none';
    if (fab) { fab.style.display = c > 0 ? 'flex' : 'none'; }
    if (fabBadge) { fabBadge.textContent = c; }
  }
};

// ===== TOAST =====
function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.innerHTML = '<span>' + (type === 'error' ? '⚠️' : '✓') + '</span> ' + msg;
  c.appendChild(t);
  setTimeout(function() { t.classList.add('removing'); setTimeout(function() { t.remove(); }, 300); }, 3000);
}

function formatCurrency(a) { return '₹' + Math.round(a).toLocaleString('en-IN'); }

// ===== MENU STATE =====
var menuItems = [];
var currentCategory = 'all';
var currentDiet = 'all';
var searchQuery = '';
var EMOJI = { starters:'🍳', mains:'🍛', biryani:'🍚', breads:'🫓', soups:'🥣', beverages:'饮料' };

// ===== LOAD MENU =====
async function loadMenu() {
  try {
    var params = 'select=*&restaurant_id=eq.' + encodeURIComponent(RESTAURANT_ID) +
      '&is_available=eq.true&order=is_bestseller.desc,name.asc';
    menuItems = await sbQuery('menu_items', params);
    console.log('Loaded ' + menuItems.length + ' menu items from Supabase');
    document.getElementById('menuLoading').style.display = 'none';
    document.getElementById('menuContent').style.display = 'block';
    renderTabs();
    renderMenu();
  } catch(err) {
    console.error('Menu load error:', err);
    document.getElementById('menuLoading').innerHTML =
      '<div class="empty-state"><span class="icon" style="font-size:3rem;">⚠️</span>' +
      '<p style="color:var(--cream-dim);margin-top:12px;">Unable to load menu. Please try again.</p>' +
      '<p style="color:rgba(245,236,218,0.4);font-size:0.82rem;margin-top:8px;">Error: ' + err.message + '</p>' +
      '<button onclick="loadMenu()" style="margin-top:16px;padding:10px 24px;background:var(--chili);color:var(--cream);border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Retry</button></div>';
  }
}

function renderTabs() {
  var cats = [];
  menuItems.forEach(function(i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
  var html = '<button class="tab active" onclick="setCategory(\'all\',this)">🍽️ All</button>';
  cats.forEach(function(c) {
    html += '<button class="tab" onclick="setCategory(\'' + c + '\',this)">' + (EMOJI[c] || '🍽️') + ' ' + c.charAt(0).toUpperCase() + c.slice(1) + '</button>';
  });
  document.getElementById('categoryTabs').innerHTML = html;
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('#categoryTabs .tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderMenu();
}

function setDiet(diet, btn) {
  currentDiet = diet;
  document.querySelectorAll('.tabs:not(#categoryTabs) .tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderMenu();
}

function renderMenu() {
  var items = menuItems;
  if (currentCategory !== 'all') items = items.filter(function(i) { return i.category === currentCategory; });
  if (currentDiet !== 'all') items = items.filter(function(i) { return i.diet === currentDiet; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    items = items.filter(function(i) { return i.name.toLowerCase().indexOf(q) !== -1 || (i.description || '').toLowerCase().indexOf(q) !== -1; });
  }

  var grid = document.getElementById('menuGrid');
  var empty = document.getElementById('menuEmpty');
  if (!items.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  var html = '';
  items.forEach(function(item) {
    var cartItems = Cart.get();
    var ci = cartItems.find(function(c) { return c.menuItemId === item.id; });
    var qty = ci ? ci.quantity : 0;
    html += '<div class="menu-card">' +
      '<div class="mc-img ' + (item.diet === 'veg' ? 'mc-veg' : 'mc-nonveg') + '">' + (EMOJI[item.category] || '🍽️') + '</div>' +
      '<div class="mc-body">' +
        '<div class="mc-top"><div>' +
          '<span class="mc-name">' + item.name + '</span>' +
          '<span class="badge ' + (item.diet === 'veg' ? 'badge-veg' : 'badge-nonveg') + '" style="margin-left:6px;">' + (item.diet === 'veg' ? 'VEG' : 'NON-VEG') + '</span>' +
          (item.is_bestseller ? '<span class="badge badge-bestseller" style="margin-left:4px;">⭐ Best</span>' : '') +
        '</div></div>' +
        '<div class="mc-desc">' + (item.description || '') + '</div>' +
        '<div class="mc-bottom">' +
          '<div><span class="mc-price">' + formatCurrency(item.price) + '</span><span class="mc-time"> · ' + (item.prep_time_min || 10) + ' min</span></div>' +
          (qty === 0 ?
            '<button class="add-btn" onclick="addToCart(\'' + item.id + '\')">ADD +</button>' :
            '<div class="qty-ctrl"><button onclick="changeQty(\'' + item.id + '\',-1)">−</button><span>' + qty + '</span><button onclick="changeQty(\'' + item.id + '\',1)">+</button></div>') +
        '</div>' +
      '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function addToCart(itemId) {
  var item = menuItems.find(function(i) { return i.id === itemId; });
  if (!item) return;
  Cart.add(item); renderMenu(); showToast(item.name + ' added to cart');
}
function changeQty(itemId, delta) {
  Cart.updateQuantity(itemId, delta); renderMenu();
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
  loadMenu();
  document.getElementById('searchInput').addEventListener('input', function(e) {
    searchQuery = e.target.value.trim().toLowerCase();
    renderMenu();
  });
  Cart.updateBadge();
});
</script>
</body>
</html>
